# YYLO package hydration uses the private monorepo directory name.
schema_version: v1
workflow_id: worktree-hydration
workflow_class: task_hydration
# Select from admitted paths and all possible finish commands, not the current diff.
hydration_selection: admitted_scope_v1
steps:
  - id: node_dependencies
    dependency_root: juno-code
    name: Hydrate exact Node lock
    probe: ["python3", ".juno_task/scripts/worktree_hydration.py", "--project-root", ".", "verify-node-lock", "--cwd", "juno-code"]
    command: ["python3", ".juno_task/scripts/worktree_hydration.py", "--project-root", ".", "hydrate-node", "--cwd", "juno-code"]
    timeout_seconds: 900
    fail_workflow: true
    non_interactive: true
    network: true
    sensitive: false
    outputs: ["juno-code/node_modules"]
  - id: benchmark_dependencies
    dependency_root: juno-benchmark
    name: Hydrate exact Benchmark Node lock
    probe: ["python3", ".juno_task/scripts/worktree_hydration.py", "--project-root", ".", "verify-node-lock", "--cwd", "juno-benchmark"]
    command: ["python3", ".juno_task/scripts/worktree_hydration.py", "--project-root", ".", "hydrate-node", "--cwd", "juno-benchmark"]
    timeout_seconds: 900
    fail_workflow: true
    non_interactive: true
    network: true
    sensitive: false
    outputs: ["juno-benchmark/node_modules"]
  - id: clean_tree
    name: Prove hydration outputs are ignored
    probe: ["python3", ".juno_task/scripts/worktree_hydration.py", "--project-root", ".", "verify-clean"]
    command: ["python3", ".juno_task/scripts/worktree_hydration.py", "--project-root", ".", "verify-clean"]
    timeout_seconds: 30
    fail_workflow: true
    non_interactive: true
    network: false
    sensitive: false
    outputs: []
