name: Plugin Security Scan
on: [pull_request, push]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@06a615ac53b269cdfe745f6165e6527fdf9378cf # v1.2.769
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
          # Trust this repository's own audited baseline
          # (docs/security-scanner-baseline.md) for the by-design rules that
          # cannot be satisfied honestly (approval-default docs, plugin.json
          # manifest for a non-plugin CLI). Everything else must pass raw.
          trust_repository_policy: "true"
