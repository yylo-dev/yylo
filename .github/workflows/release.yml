name: Verify YYLO CLI release artifact

# Package-level exact verification aligned to the one guarded release
# contract: an explicit exact version and channel are required, the exact
# artifact is packed and hash-bound, and the registry readback is compared
# against it. There is deliberately no publish step and no npm token here:
# publication authority belongs exclusively to the guarded
# scripts/release-yylo.py plan/apply flow through scripts/release-authority.sh.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version expected at this commit
        required: true
        type: string
      dist_tag:
        description: npm dist-tag (next for prerelease, latest for stable)
        required: true
        type: choice
        options: [next, latest]

permissions:
  contents: read

jobs:
  verify:
    name: Verify and bind @yylo/cli artifact
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: "@yylo/cli"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.3"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Enforce Node >=20.10
        run: node -e "const [major,minor]=process.versions.node.split('.').map(Number); if (major<20 || (major===20 && minor<10)) { console.error('Node >=20.10 required'); process.exit(1); }"
      - run: npm ci
      - name: Verify exact version and channel
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_TAG: ${{ inputs.dist_tag }}
        run: |
          node - <<'NODE'
          const version = require('./package.json').version;
          if (version !== process.env.EXPECTED_VERSION) throw new Error(`version mismatch: ${version}`);
          const expected = version.includes('-') ? 'next' : 'latest';
          if (process.env.EXPECTED_TAG !== expected) throw new Error(`dist-tag must be ${expected}`);
          NODE
      - run: npm test
      - run: npm run typecheck
      - name: Pack the exact artifact
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          npm pack --json --pack-destination "$RUNNER_TEMP/artifacts" | tee "$RUNNER_TEMP/pack.json"
          node - <<'NODE'
          const summary = require(process.env.RUNNER_TEMP + '/pack.json');
          const row = summary[0];
          if (row.name !== process.env.PACKAGE_NAME || row.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`packed identity mismatch: ${row.name}@${row.version}`);
          }
          console.log(`packed ${row.filename} sha1=${row.shasum}`);
          NODE
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
      - name: Compare the bound artifact against the registry readback
        run: |
          expected=$(node -e "console.log(require(process.env.RUNNER_TEMP + '/pack.json')[0].shasum)")
          set +e
          actual=$(npm view "${PACKAGE_NAME}@${{ inputs.version }}" dist-shasum 2>"$RUNNER_TEMP/view.err")
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            [ "$expected" = "$actual" ] && echo "registry already carries the exact bound artifact" \
              || { echo "registry artifact differs from this build: $actual"; exit 1; }
            tags=$(npm view "${PACKAGE_NAME}@${{ inputs.version }}" dist-tags --json)
            echo "$tags"
            printf '%s' "$tags" | EXPECTED_TAG="${{ inputs.dist_tag }}" EXPECTED_VERSION="${{ inputs.version }}" \
              node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const t=JSON.parse(d)[process.env.EXPECTED_TAG]; if(t!==process.env.EXPECTED_VERSION){console.error('dist-tag drift: '+process.env.EXPECTED_TAG+' -> '+t); process.exit(1);}});"
          elif grep -q "E404" "$RUNNER_TEMP/view.err"; then
            echo "registry does not carry ${PACKAGE_NAME}@${{ inputs.version }} yet; publication remains the guarded apply flow"
          else
            cat "$RUNNER_TEMP/view.err"
            echo "npm registry probe failed without an explicit not-found response" >&2
            exit 1
          fi
